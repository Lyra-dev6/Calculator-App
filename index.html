<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible"
        content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="total">
            <input type="text" id="display" disabled>
            <div class="buttons">
                 <button class="gray" onclick="clearDisplay()">C</button>
                <button class="gray">±</button> 
                <button class="gray">%</button> 
                <button class="orange" onclick="appendToDisplay('/')">/</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button class="orange" onclick="appendToDisplay('*')">*</button>

                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button class="orange" onclick="appendToDisplay('-')">-</button>
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button class="orange" onclick="appendToDisplay('+')">+</button>
                <button onclick="appendToDisplay('0')" style="grid-column: span 2; width: 155px; border-radius: 40px;">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button class="orange" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    </body>
